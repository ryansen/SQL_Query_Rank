[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "queryrank"
version = "0.1.0"
description = "A PostgreSQL-based SQL practice and query evaluation CLI"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "psycopg[binary]>=3.1.0",
    "python-dotenv>=1.0.0",
    "sqlglot>=23.0.0",
    "faker>=24.0.0",
]

[project.scripts]
queryrank = "queryrank.main:app"

[tool.hatch.build.targets.wheel]
packages = ["queryrank"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]
